name: Astra Customs Bot Checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Runtime versions
        run: node --version && npm --version
      - name: Clean install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: JavaScript syntax validation
        run: find commands events services utils -name '*.js' -print0 | xargs -0 -n1 node --check
